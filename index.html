<!DOCTYPE html>
<html lang="fr" class="h-full bg-black text-white dark">
<head>
    <!-- Google AdSense (conservé tel quel) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1812112806549571"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <script type="importmap">
    {

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        boostPink: '#FE2C55',
                        boostCyan: '#25F4EE',
                        boostDark: '#121212',
                        boostCard: '#1E1E1E',
                        boostBorder: '#2A2A2A'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #2A2A2A; border-radius: 3px; }
        .video-container { scroll-snap-type: y mandatory; }
        .video-card { scroll-snap-align: start; }
        .box-glow-pink { box-shadow: 0 0 20px rgba(254, 44, 85, 0.3); }
        .box-glow-cyan { box-shadow: 0 0 20px rgba(37, 244, 238, 0.3); }
    </style>
</head>
